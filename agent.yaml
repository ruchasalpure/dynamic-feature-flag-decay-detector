spec_version: "0.1.0"
name: "dynamic-feature-flag-decay-detector"
version: "1.0.0"
category: "devtools"
author: "Rucha Salpure"
description: "Scans enterprise codebase ASTs for stale, 100% rolled-out feature toggles and automatically synthesizes cleanup pull requests"
capabilities:
  - "ast-feature-flag-cleanup"
  - "autonomous-decision-making"
  - "explainable-auditing"
  - "multi-agent-collaboration"
skills:
  - "ast-feature-flag-cleanup"
tools:
  - "python_executor"
  - "audit_logger"
  - "schema_validator"
runtime:
  environment: "python3.11"
  memory_limit: "4GB"
  timeout_seconds: 300
governance:
  audit_logging: true
  human_in_the_loop: false
  maker_checker: true
  explainability_required: true
