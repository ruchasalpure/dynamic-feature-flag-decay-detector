spec_version: "0.1.0"
name: dynamic-feature-flag-decay-detector
version: 1.0.0
description: Scans enterprise codebase ASTs for stale, 100% rolled-out feature toggles and automatically synthesizes cleanup pull requests.
author: "Rucha Salpure"
license: MIT
model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 4096
skills:
  - ast-feature-flag-cleanup
tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - devtools
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/ruchasalpure/dynamic-feature-flag-decay-detector"
